# electron-builder 打包配置（P11：交付 Windows exe）
appId: com.codeacademy.desk
productName: Code Academy Desk
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - resources/**
asar: true
# interactive 编译器 esbuild 的平台二进制必须可被 spawn（asar 内无法执行）
asarUnpack:
  - node_modules/@esbuild/**
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
